services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
  db:
    image: mariadb:11.8.6
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-11-8-6-data:/var/lib/mysql
volumes:
  mailpit-data:
  mariadb-11-8-6-data:
